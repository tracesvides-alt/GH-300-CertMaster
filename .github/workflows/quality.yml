name: Question quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Audit production and development dependencies
        run: |
          mkdir -p artifacts
          npm audit --audit-level=high --json > artifacts/dependency-audit.json
      - name: Preserve dependency audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit
          path: artifacts/dependency-audit.json
          if-no-files-found: warn
          retention-days: 30
      - run: npm run quality:check
      - run: npm run difficulty:check
      - run: npm run applied:check
      - run: npm run exam:check
      - run: npm run check
      - run: npm test
      - name: Install browser for security regression tests
        run: npx playwright install --with-deps chromium
      - name: Verify browser protections and service worker downloads
        run: npx playwright test security.spec.ts service-worker.spec.ts --workers=2
