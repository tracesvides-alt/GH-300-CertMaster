name: Question quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Audit production and development dependencies
        run: |
          mkdir -p artifacts
          npm audit --audit-level=high --json > artifacts/dependency-audit.json
      - name: Preserve dependency audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: artifacts/dependency-audit.json
          if-no-files-found: warn
          retention-days: 30
      - run: npm run quality:check
      - run: npm run difficulty:check
      - run: npm run applied:check
      - run: npm run exam:check
      - run: npm run check
      - run: npm test
      - name: Install browser for security regression tests
        run: npx playwright install --with-deps chromium
      - name: Verify browser protections and service worker downloads
        run: npx playwright test security.spec.ts service-worker.spec.ts --workers=2
