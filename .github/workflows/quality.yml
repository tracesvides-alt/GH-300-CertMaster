name: Question quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production and development dependencies
        run: |
          mkdir -p artifacts
          npm audit --audit-level=high --json > artifacts/dependency-audit.json
      - name: Preserve dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: artifacts/dependency-audit.json
          if-no-files-found: warn
          retention-days: 30
      - run: npm run quality:check
      - run: npm run difficulty:check
      - run: npm run applied:check
      - run: npm run exam:check
      - run: npm run check
      - run: npm test
